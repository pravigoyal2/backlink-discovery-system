<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Web Resource Discovery Hub</title>
  <meta name="description" content="A frequently updated directory of recently discovered public web resources.">
  <meta name="robots" content="index,follow">
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f7f8fb;color:#151515}
    .wrap{max-width:900px;margin:auto;padding:48px 20px}
    .card{background:#fff;border:1px solid #e6e8ee;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
    a{color:#175cd3;text-decoration:none}
    .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px}
    h1{font-size:38px;line-height:1.15;margin-top:0}
    p{font-size:17px;line-height:1.7;color:#4a4f5a}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Web Resource Discovery Hub</h1>
      <p>This site publishes recently discovered public web resources and maintains crawlable internal links, RSS updates and an XML sitemap.</p>
      <div class="links">
        <a href="/latest">Latest Resources</a>
        <a href="/sitemap.xml">XML Sitemap</a>
        <a href="/feed.xml">RSS Feed</a>
      </div>
    </section>
  </main>
</body>
</html>
